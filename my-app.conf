server {
    listen 80;
    server_name my-app.local; # Nhập IP hoặc domain thực tế của bạn

    # Trỏ root về thư mục an toàn ngoài /var/www
    root /opt/my-app/html;
    index index.html index.htm;

    # Thay đổi đường dẫn ghi Logs 
    access_log /opt/my-app/logs/access.log;
    error_log /opt/my-app/logs/error.log;

    location / {
        try_files $uri $uri/ =404;
    }
}
